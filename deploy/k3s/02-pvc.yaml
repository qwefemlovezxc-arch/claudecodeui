apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-workspace
  namespace: claudecode
  labels:
    app: claudecodeui
    component: workspace
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-state
  namespace: claudecode
  labels:
    app: claudecodeui
    component: state
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
