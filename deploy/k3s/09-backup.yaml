# Daily rsync backup of /workspace/nastya → homelab:/mnt/pv-hdd/.
#
# Runs as a separate pod (no VPN sidecar) on the same node (server3)
# so it can reach homelab directly over the home LAN (192.168.100.200)
# and mount the workspace PVC in parallel with the app pod (RWO on same
# node is allowed for multiple pods).
#
# Design note (this is the bit the runbook expands on):
#   - Backup writes per-run timestamped subdirs `${STAMP}/`, so a
#     destructive sync of an empty workspace cannot wipe history.
#   - The forced command on homelab uses `rrsync` (ships with rsync,
#     enable in /usr/local/bin), chrooted to the backups base dir, so
#     the client can pick any subpath inside that base — but nothing
#     outside it. See DEPLOYMENT.md §2c for setup.
#   - Rotation does NOT happen in this Job. Instead, a homelab-side
#     cron prunes dirs older than 14 days (DEPLOYMENT.md §2d). This
#     keeps the SSH key purely an rsync-restricted credential — the
#     shell-pipeline rotation that used to live here would have been
#     silently rewritten to `rsync --server` by the forced command and
#     never executed.
#
# Failure alerting: the Job's pod failures show up in kubelet events
# and (via existing kube-state-metrics + alertmanager) on the existing
# Telegram forwarder.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: workspace-backup
  namespace: claudecode
  labels:
    app: claudecodeui
    component: backup
spec:
  schedule: "30 3 * * *"                   # 03:30 UTC daily
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800      # keep completed Jobs 7 days
      template:
        metadata:
          labels:
            # Intentionally NOT labeled app=claudecodeui so the
            # NetworkPolicy in 07-networkpolicy.yaml (which restricts
            # egress to UDP:45649 only) doesn't apply — the backup pod
            # needs to hit alpine repos + homelab SSH.
            component: claudecode-backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: server3
          automountServiceAccountToken: false
          # Backup container runs as root so `apk add` can install rsync
          # and openssh-client into a plain alpine image. Blast radius is
          # tight: the pod only mounts /workspace RO and the SSH key
          # Secret RO, has no service account, and terminates in seconds.
          # A pre-baked image would be cleaner but isn't worth the
          # extra build for a once-a-day 30s job.
          containers:
            - name: rsync
              image: mirror.gcr.io/library/alpine:3.20
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  set -e
                  # apk needs root; we're running as uid 1000. Ship the
                  # package cache pre-populated by installing at build
                  # time would be cleaner, but for now add --no-root
                  # via pre-downloaded wheels is overkill. Two options:
                  # either bake into a custom image, or use /tmp for
                  # state because /home/ isn't writable by uid 1000.
                  apk add --no-cache rsync openssh-client >/dev/null 2>&1 || {
                    # apk failed (network or perms). Fall through only
                    # if rsync+ssh are already available.
                    command -v rsync >/dev/null && command -v ssh >/dev/null \
                      || { echo "rsync/ssh unavailable and apk failed"; exit 1; }
                  }

                  # /tmp is writable by uid 1000; /home/backup isn't.
                  mkdir -p /tmp/ssh
                  cp /run/ssh/id_ed25519 /tmp/ssh/id_ed25519
                  cp /run/ssh/known_hosts /tmp/ssh/known_hosts
                  chmod 600 /tmp/ssh/id_ed25519 /tmp/ssh/known_hosts

                  STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
                  # rrsync chroots the destination to the backups base
                  # dir on homelab, so we send the relative subpath only.
                  DEST="maclaren555@192.168.100.200:${STAMP}/"

                  rsync -av --delete \
                    -e "ssh -i /tmp/ssh/id_ed25519 -o UserKnownHostsFile=/tmp/ssh/known_hosts -o StrictHostKeyChecking=yes" \
                    /workspace/ "$DEST"

                  echo "backup ok: ${STAMP}"
                  # Rotation is performed by a homelab-side cron (see
                  # DEPLOYMENT.md §2d). Keeping it out of this Job is
                  # what lets the SSH key stay rsync-only.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                  readOnly: true
                - name: ssh
                  mountPath: /run/ssh
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: claude-workspace
                readOnly: true
            - name: ssh
              secret:
                secretName: claudecode-backup-ssh
                defaultMode: 0400
