apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudecodeui
  namespace: claudecode
  labels:
    app: claudecodeui
spec:
  replicas: 1
  strategy:
    type: Recreate    # single writer to PVCs; no rolling updates
  selector:
    matchLabels:
      app: claudecodeui
  template:
    metadata:
      labels:
        app: claudecodeui
    spec:
      # Pin to server3 — k3s master, healthy disk, where both PVCs live
      # under the local-path provisioner.
      nodeSelector:
        kubernetes.io/hostname: server3
      automountServiceAccountToken: false

      # Route DNS through the VPN tunnel too. If we left dnsPolicy at the
      # default (ClusterFirst), the app would resolve via kube-dns and
      # then its outbound traffic would bypass the wg0 route for DNS.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.64.0.1    # VPN internal resolver (from nl.conf DNS=)
          - 8.8.4.4

      initContainers:
        # ── OAuth bootstrap ──────────────────────────────────────────
        # Seeds /home/claude/.claude/.credentials.json from the Secret
        # on first run, so the Claude CLI has a valid token without the
        # operator needing to `claude login` interactively in the pod.
        # Idempotent: on subsequent restarts the PVC already holds the
        # file (possibly with a refreshed token) and we leave it alone.
        - name: oauth-bootstrap
          image: mirror.gcr.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              if [ ! -s /state/.credentials.json ]; then
                cp /bootstrap/credentials.json /state/.credentials.json
                chmod 600 /state/.credentials.json
                chown 1000:1000 /state/.credentials.json
                echo "credentials.json bootstrapped from secret"
              else
                echo "credentials.json already exists on PVC, leaving as-is"
              fi
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: state
              mountPath: /state
            - name: oauth-bootstrap
              mountPath: /bootstrap
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }

        # ── Sidecar: AmneziaWG userspace tunnel ──────────────────────
        # Native k8s sidecar (initContainer with restartPolicy: Always).
        # Starts after oauth-bootstrap completes, stays up for the pod
        # lifetime, app container waits for its startup probe before it
        # begins.
        - name: vpn
          image: ghcr.io/qwefemlovezxc-arch/amneziawg-sidecar:latest
          imagePullPolicy: Never    # local-only image, built+imported on server3
          restartPolicy: Always
          env:
            - name: AWG_CONFIG_PATH
              value: /etc/amneziawg/wg0.conf
            - name: AWG_INTERFACE
              value: wg0
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              # NET_ADMIN — manipulate routes, bring up wg0
              # MKNOD     — create /dev/net/tun when the container fs has
              #             no device node yet (common in k3s pods)
              drop: [ALL]
              add: [NET_ADMIN, MKNOD]
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: vpn-config
              mountPath: /etc/amneziawg
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "ip link show wg0 | grep -q 'state UNKNOWN\\|state UP' && awg show wg0 | grep -q 'latest handshake'"
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          livenessProbe:
            exec:
              command: [sh, -c, "ip link show wg0 >/dev/null 2>&1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: ghcr.io/qwefemlovezxc-arch/claudecodeui-sandbox:latest
          imagePullPolicy: Never    # local-only image, built+imported on server3
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: WORKSPACES_ROOT
              value: /workspace/nastya
            - name: SERVER_PORT
              value: "3001"
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: DATABASE_PATH
              value: /home/claude/.claude/claudecodeui.db
            - name: CONTEXT_WINDOW
              value: "160000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claudecode-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace/nastya
            - name: state
              mountPath: /home/claude/.claude
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: claude-workspace
        - name: state
          persistentVolumeClaim:
            claimName: claude-state
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: vpn-config
          secret:
            secretName: claudecode-vpn
            items:
              - key: wg0.conf
                path: wg0.conf
        - name: oauth-bootstrap
          secret:
            secretName: claudecode-oauth
            items:
              - key: credentials.json
                path: credentials.json
            defaultMode: 0400
