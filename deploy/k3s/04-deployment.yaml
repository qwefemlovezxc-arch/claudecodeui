apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudecodeui
  namespace: claudecode
  labels:
    app: claudecodeui
spec:
  replicas: 1
  strategy:
    type: Recreate    # single writer to PVCs; no rolling updates
  selector:
    matchLabels:
      app: claudecodeui
  template:
    metadata:
      labels:
        app: claudecodeui
    spec:
      # Pin to server3 — k3s master, healthy disk, where both PVCs live
      # under the local-path provisioner.
      nodeSelector:
        kubernetes.io/hostname: server3
      automountServiceAccountToken: false

      # Route DNS through the VPN tunnel too. If we left dnsPolicy at the
      # default (ClusterFirst), the app would resolve via kube-dns and
      # then its outbound traffic would bypass the wg0 route for DNS.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.64.0.1    # VPN internal resolver (from nl.conf DNS=)
          - 8.8.4.4

      initContainers:
        # ── Sidecar: AmneziaWG userspace tunnel ──────────────────────
        # Native k8s sidecar (initContainer with restartPolicy: Always).
        # Stays up for the pod lifetime; the app container waits for its
        # startup probe before it begins.
        - name: vpn
          image: ghcr.io/qwefemlovezxc-arch/amneziawg-sidecar:latest
          imagePullPolicy: Never    # local-only image, built+imported on server3
          restartPolicy: Always
          env:
            - name: AWG_CONFIG_PATH
              value: /etc/amneziawg/wg0.conf
            - name: AWG_INTERFACE
              value: wg0
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              # NET_ADMIN — manipulate routes, bring up wg0
              # MKNOD     — create /dev/net/tun when the container fs has
              #             no device node yet (common in k3s pods)
              drop: [ALL]
              add: [NET_ADMIN, MKNOD]
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: vpn-config
              mountPath: /etc/amneziawg
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "ip link show wg0 | grep -q 'state UNKNOWN\\|state UP' && awg show wg0 | grep -q 'latest handshake'"
            initialDelaySeconds: 3
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          livenessProbe:
            exec:
              command: [sh, -c, "ip link show wg0 >/dev/null 2>&1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: ghcr.io/qwefemlovezxc-arch/claudecodeui-sandbox:latest
          imagePullPolicy: Never    # local-only image, built+imported on server3
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: WORKSPACES_ROOT
              value: /workspace/nastya
            - name: SERVER_PORT
              value: "3001"
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: DATABASE_PATH
              value: /home/claude/.claude/claudecodeui.db
            - name: CONTEXT_WINDOW
              value: "160000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claudecode-secrets
                  key: JWT_SECRET
            # Long-lived Claude Code OAuth token (from `claude setup-token`
            # on the user's macbook). Independent of the macbook's
            # interactive OAuth session — no refresh-token race between
            # the two devices. The CLI prefers this env var over any
            # ~/.claude/.credentials.json on disk.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: claudecode-oauth
                  key: CLAUDE_CODE_OAUTH_TOKEN
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace/nastya
            - name: state
              mountPath: /home/claude/.claude
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: claude-workspace
        - name: state
          persistentVolumeClaim:
            claimName: claude-state
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: vpn-config
          secret:
            secretName: claudecode-vpn
            items:
              - key: wg0.conf
                path: wg0.conf
