apiVersion: apps/v1
kind: Deployment
metadata:
  name: claudecodeui
  namespace: claudecode
  labels:
    app: claudecodeui
spec:
  replicas: 1
  strategy:
    type: Recreate    # single writer to PVCs; no rolling updates
  selector:
    matchLabels:
      app: claudecodeui
  template:
    metadata:
      labels:
        app: claudecodeui
    spec:
      # Pin to server3 — k3s master, healthy disk, where both PVCs live
      # under the local-path provisioner.
      nodeSelector:
        kubernetes.io/hostname: server3
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/qwefemlovezxc-arch/claudecodeui-sandbox:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: WORKSPACES_ROOT
              value: /workspace/nastya
            - name: SERVER_PORT
              value: "3001"
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: DATABASE_PATH
              value: /home/claude/.claude/claudecodeui.db
            - name: CONTEXT_WINDOW
              value: "160000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: claudecode-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # node writes to /tmp, /app/node_modules/.cache
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /workspace/nastya
            - name: state
              mountPath: /home/claude/.claude
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: claude-workspace
        - name: state
          persistentVolumeClaim:
            claimName: claude-state
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
