apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claudecodeui-netpol
  namespace: claudecode
  labels:
    app: claudecodeui
spec:
  podSelector:
    matchLabels:
      app: claudecodeui
  policyTypes: [Ingress, Egress]

  ingress:
    # Traefik (kube-system) reaches the app on :3001.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: http
          protocol: TCP

  egress:
    # The VPN sidecar must reach its peer (the endpoint IP from nl.conf).
    # Nothing else on the pod's eth0 is allowed — every legitimate outbound
    # packet from the app container is encapsulated inside UDP to this
    # endpoint, so this is the only external destination the pod needs.
    #
    # If the VPN peer IP ever changes, update the cidr below.
    - to:
        - ipBlock:
            cidr: 89.105.199.130/32
      ports:
        - port: 45649
          protocol: UDP
